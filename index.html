<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Коридор — Онлайн Издание</title>
    
    <!-- ИСПРАВЛЕНО: Рабочая, стабильная ссылка на Supabase с серверов cdnjs -->
    <script src="https://cloudflare.com"></script>
    
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #f0f0f0; font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; }
        .screen { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; position: absolute; }
        .screen.active { display: flex; }
        .menu-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); text-align: center; max-width: 440px; width: 90%; }
        h1 { margin-top: 0; color: #2c3e50; font-size: 26px; margin-bottom: 20px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; font-size: 15px; font-weight: bold; color: #555; }
        .setting-row select, .setting-row input { box-sizing: border-box; padding: 6px; width: 190px; height: 36px; border: 2px solid #bdc3c7; border-radius: 6px; font-size: 14px; font-weight: bold; text-align: center; }
        #game-info { display: flex; flex-direction: column; align-items: center; margin-bottom: 10px; font-weight: bold; }
        #status { font-size: 20px; margin-bottom: 4px; text-align: center; color: #3498db; }
        #w-count { font-size: 15px; color: #555; margin: 2px 0; }
        #board { display: grid; background: #64574a; padding: 10px; border-radius: 6px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); }
    </style>
</head>

<body>

    <!-- ГЛАВНОЕ МЕНЮ -->
    <div id="menu-screen" class="screen active">
        <div class="menu-card">
            <h1>Коридор</h1>
            <div class="setting-row"><span>Режим игры:</span>
                <select id="cfg-mode" onchange="updateMenuSteps()">
                    <option value="pvp" selected>На двоих (один экран)</option>
                    <option value="online">Онлайн игра (по сети)</option>
                </select>
            </div>
            <div id="online-panel" style="display: none; border-top: 2px dashed #bdc3c7; margin-top: 15px; padding-top: 10px;">
                <button class="btn-main" onclick="initOnlineGame(true)">🏠 Создать новую комнату</button>
                <div style="margin: 10px 0; font-weight: bold; color: #7f8c8d;">ИЛИ</div>
                <div class="setting-row">
                    <input type="text" id="room-input" style="text-transform: uppercase;" placeholder="ВВЕДИТЕ ID КОМНАТЫ">
                </div>
                <button class="btn-main" style="background: #2ecc71;" onclick="initOnlineGame(false)">⚔️ Войти в комнату</button>
            </div>
            <div id="extended-settings">
                <div class="setting-row"><span>Размер поля:</span>
                    <select id="cfg-size">
                        <option value="7">7 х 7 (Быстрая)</option>
                        <option value="9" selected>9 x 9 (Классика)</option>
                        <option value="11">11 х 11 (Большая)</option>
                    </select>
                </div>
                <div class="setting-row"><span>Количество стен:</span><input type="number" id="cfg-walls" value="10" min="0" max="20"></div>
                <button id="btn-start-local" class="btn-main" onclick="initGame()">⚔️ Начать матч</button>
            </div>
            <div id="menu-status" style="margin-top: 15px; font-weight: bold; color: #e74c3c; font-size: 14px; min-height: 20px;"></div>
        </div>
    </div>
    <!-- ИГРОВОЙ ЭКРАН -->
    <div id="game-screen" class="screen">
        <div id="game-info">
            <div id="room-id-display" style="font-size: 14px; color: #7f8c8d; margin-bottom: 5px; font-weight: bold; display: none;"></div>
            <div id="status">Ход Синего (Игрок 1)</div>
            <div id="w-count">Стены Синего: 10 | Красного: 10</div>
        </div>
        <div id="board"></div>
        <div id="controls">
            <button id="btn-wall-h" onclick="toggleWallMode('wall-h')">➖ Горизонтальная</button>
            <button id="btn-wall-v" onclick="toggleWallMode('wall-v')">┃ Вертикальная</button>
            <button id="btn-menu" style="background:#e74c3c; color:white;" onclick="location.reload()">🚪 В меню</button>
        </div>
    </div>

    <!-- ОКНО РЕЗУЛЬТАТОВ -->
    <div id="result-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 10; align-items: center; justify-content: center;">
        <div class="menu-card" style="max-width: 380px;">
            <h1 id="md-winner" style="color: #27ae60; margin-bottom: 10px;">Победил Синий 🎉</h1>
            <table style="width: 100%; margin: 15px 0; border-collapse: collapse; text-align: left; font-size: 14px;">
                <tr style="color: #7f8c8d;"><th style="padding: 6px 0;">Параметр</th><th style="color: #3498db;">Синий</th><th style="color: #e74c3c;">Красный</th></tr>
                <tr style="border-bottom: 1px solid #eee;"><td style="padding: 8px 0; font-weight: bold; color:#555;">Сделано ходов</td><td id="st-m1" style="font-weight: bold;">0</td><td id="st-m2" style="font-weight: bold;">0</td></tr>
                <tr style="border-bottom: 1px solid #eee;"><td style="padding: 8px 0; font-weight: bold; color:#555;">Построено стен</td><td id="st-w1" style="font-weight: bold;">0</td><td id="st-w2" style="font-weight: bold;">0</td></tr>
                <tr style="border-bottom: 1px solid #eee;"><td style="padding: 8px 0; font-weight: bold; color:#555;" colspan="2">Общее время матча:</td><td id="st-total-time" style="font-weight: bold; text-align: right; color: #2c3e50;">0с</td></tr>
            </table>
            <button class="btn-main" onclick="location.reload()">🔄 Начать заново</button>
        </div>
    </div>
    <script>
        // Полностью настроенная конфигурация вашего проекта Supabase
        const SUPABASE_URL = "https://supabase.co";
        const SUPABASE_KEY = "sb_publishable_C44fvGvSPNnElOFZ0WAyDQ_nZniiuw1";

        let supabase = null;
        let currentRoomId = null;
        let channel = null;

        // Инициализация клиента Supabase
        try {
            if (typeof supabase !== 'undefined') {
                supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            }
        } catch (e) {
            console.log("Supabase заблокирован локально, включен автономный режим.");
        }

        let state = {
            size: 9, maxWalls: 10, currentTurn: 1, mode: 'pvp', myPlayerId: 1,
            p1: { r: 0, c: 0, walls: 10, moves: 0 }, p2: { r: 0, c: 0, walls: 10, moves: 0 },
            wallsH: [], wallsV: [], wallMode: null
        };
        let matchTimer = null; let totalGameTime = 0;

        function updateMenuSteps() {
            const mode = document.getElementById('cfg-mode').value;
            document.getElementById('online-panel').style.display = mode === 'online' ? 'block' : 'none';
            document.getElementById('extended-settings').style.display = mode === 'pvp' ? 'block' : 'none';
            document.getElementById('menu-status').innerText = "";
        }

        function initGame() {
            state.mode = 'pvp'; state.myPlayerId = 1;
            state.size = parseInt(document.getElementById('cfg-size').value);
            state.maxWalls = parseInt(document.getElementById('cfg-walls').value);
            startOnlineMatch();
        }


        function initOnlineGame(isHost) {
            const statusLabel = document.getElementById('menu-status');
            statusLabel.innerText = "Подключение к сети..."; statusLabel.style.color = "#3498db";
            state.mode = 'online';
            state.size = parseInt(document.getElementById('cfg-size').value);
            state.maxWalls = parseInt(document.getElementById('cfg-walls').value);

            if (isHost) {
                state.myPlayerId = 1;
                currentRoomId = Math.random().toString(36).substr(2, 5).toUpperCase();
                statusLabel.innerText = `ID для друга: ${currentRoomId}`; statusLabel.style.color = "#2ecc71";
                document.getElementById('room-id-display').innerText = `ID КОМНАТЫ: ${currentRoomId}`;
                document.getElementById('room-id-display').style.display = 'block';
                setupSupabaseChannel(currentRoomId, true);
            } else {
                state.myPlayerId = 2;
                const roomId = document.getElementById('room-input').value.trim().toUpperCase();
                if (!roomId) { statusLabel.innerText = "Введите ID!"; statusLabel.style.color = "#e74c3c"; return; }
                currentRoomId = roomId;
                document.getElementById('room-id-display').innerText = `ID КОМНАТЫ: ${roomId}`;
                document.getElementById('room-id-display').style.display = 'block';
                setupSupabaseChannel(roomId, false);
            }
        }

        function setupSupabaseChannel(roomId, isHost) {
            channel = supabase.channel('room_' + roomId, { config: { broadcast: { self: false } } });
            
            channel.on('broadcast', { event: 'game_action' }, (response) => {
                // Защита: считываем данные независимо от того, как их упаковал сервер Supabase
                const data = response.payload || response;
                if (!data) return;

                if (data.type === 'START' && !isHost) {
                    state.size = data.size; 
                    state.maxWalls = data.maxWalls; 
                    startOnlineMatch();
                } else if (data.type === 'MOVE') {
                    const opp = state.currentTurn === 1 ? state.p1 : state.p2;
                    opp.r = data.r; opp.c = data.c; opp.moves++; 
                    checkWinOrSwitch();
                } else if (data.type === 'WALL') {
                    if (data.wallType === 'h') { state.wallsH[data.r][data.c] = 1; } else { state.wallsV[data.r][data.c] = 1; }
                    renderNetworkWall(data.wallType, data.r, data.c, state.currentTurn);
                    const opp = state.currentTurn === 1 ? state.p1 : state.p2; 
                    opp.walls--; 
                    checkWinOrSwitch();
                } else if (data.type === 'JOIN_REQ' && isHost) {
                    // Хост услышал гостя и мгновенно высылает ему настройки карты для старта
                    channel.send({
                        type: 'broadcast',
                        event: 'game_action',
                        payload: { type: 'START', size: state.size, maxWalls: state.maxWalls }
                    });
                    document.getElementById('menu-status').innerText = "Игрок подключился! Старт...";
                    document.getElementById('menu-status').style.color = "#2ecc71";
                    setTimeout(startOnlineMatch, 800);
                }
            });

            channel.subscribe((status) => {
                if (status === 'SUBSCRIBED' && !isHost) {
                    // Гость успешно зашел в комнату и стучится к хосту
                    setTimeout(() => {
                        channel.send({
                            type: 'broadcast',
                            event: 'game_action',
                            payload: { type: 'JOIN_REQ' }
                        });
                    }, 200);
                }
            });
        }

        function startOnlineMatch() {
            state.p1 = { r: state.size - 1, c: Math.floor(state.size / 2), walls: state.maxWalls, moves: 0 };
            state.p2 = { r: 0, c: Math.floor(state.size / 2), walls: state.maxWalls, moves: 0 };
            state.currentTurn = 1; state.wallMode = null; buildBoard(); switchScreen('game-screen'); startTimer();
        }

        function buildBoard() {
            const board = document.getElementById('board'); board.innerHTML = ''; let grid = '';
            for (let i = 0; i < state.size; i++) { grid += 'auto ' + (i < state.size - 1 ? '12px ' : ''); }
            board.style.gridTemplateColumns = grid; board.style.gridTemplateRows = grid;
            state.wallsH = Array(state.size - 1).fill().map(() => Array(state.size - 1).fill(0));
            state.wallsV = Array(state.size - 1).fill().map(() => Array(state.size - 1).fill(0));

            for (let r = 0; r < state.size * 2 - 1; r++) {
                for (let c = 0; c < state.size * 2 - 1; c++) {
                    const isCellR = r % 2 === 0, isCellC = c % 2 === 0;
                    if (isCellR && isCellC) {
                        const cell = document.createElement('div'); cell.className = 'cell'; const cr = r / 2, cc = c / 2; cell.dataset.r = cr; cell.dataset.c = cc;
                        if (cr === 0) cell.classList.add('goal-blue'); if (cr === state.size - 1) cell.classList.add('goal-red');
                        cell.onclick = () => handleCellClick(cr, cc); board.appendChild(cell);
                    } else if (isCellR && !isCellC) {
                        const w = document.createElement('div'); w.className = 'wall-space-v'; const wr = r / 2, wc = (c - 1) / 2; w.dataset.r = wr; w.dataset.c = wc;
                        w.onmouseenter = () => hoverWall('v', wr, wc, true); w.onmouseleave = () => hoverWall('v', wr, wc, false); w.onclick = () => placeWall('v', wr, wc); board.appendChild(w);
                    } else if (!isCellR && isCellC) {
                        const w = document.createElement('div'); w.className = 'wall-space-h'; const wr = (r - 1) / 2, wc = c / 2; w.dataset.r = wr; w.dataset.c = wc;
                        w.onmouseenter = () => hoverWall('h', wr, wc, true); w.onmouseleave = () => hoverWall('h', wr, wc, false); w.onclick = () => placeWall('h', wr, wc); board.appendChild(w);
                    } else {
                        const x = document.createElement('div'); x.className = 'wall-space-intersection'; x.id = `x-${(r - 1) / 2}-${(c - 1) / 2}`; board.appendChild(x);
                    }
                }
            }
            setTimeout(updateView, 50);
        }

        function updateView() {
            document.querySelectorAll('.player').forEach(p => p.remove()); document.querySelectorAll('.cell').forEach(c => c.classList.remove('valid-move'));
            const c1 = document.querySelector(`.cell[data-r="${state.p1.r}"][data-c="${state.p1.c}"]`); if (c1) { const p = document.createElement('div'); p.className = 'player p1'; c1.appendChild(p); }
            const c2 = document.querySelector(`.cell[data-r="${state.p2.r}"][data-c="${state.p2.c}"]`); if (c2) { const p = document.createElement('div'); p.className = 'player p2'; c2.appendChild(p); }
            const txt = document.getElementById('status');
            if (state.currentTurn === 1) { txt.innerText = "Ход Синего (Игрок 1)"; txt.style.color = "#3498db"; } else { txt.innerText = "Ход Красного (Игрок 2)"; txt.style.color = "#e74c3c"; }
            document.getElementById('w-count').innerText = `Стены Синего: ${state.p1.walls} | Красного: ${state.p2.walls}`;
            if (!state.wallMode && (state.mode === 'pvp' || state.currentTurn === state.myPlayerId)) showValidMoves();
        }

        function showValidMoves() {
            const cur = state.currentTurn === 1 ? state.p1 : state.p2; const opp = state.currentTurn === 1 ? state.p2 : state.p1;
            const dirs = [{dr: -1, dc: 0}, {dr: 1, dc: 0}, {dr: 0, dc: -1}, {dr: 0, dc: 1}];
            dirs.forEach(d => {
                const nr = cur.r + d.dr, nc = cur.c + d.dc;
                if (nr >= 0 && nr < state.size && nc >= 0 && nc < state.size && !isWallBetween(cur.r, cur.c, nr, nc)) {
                    if (nr === opp.r && nc === opp.c) {
                        const jr = nr + d.dr, jc = nc + d.dc;
                        if (jr >= 0 && jr < state.size && jc >= 0 && jc < state.size && !isWallBetween(nr, nc, jr, jc)) { markValid(jr, jc); } 
                        else {
                            if (d.dr !== 0) {
                                if (nc - 1 >= 0 && !isWallBetween(nr, nc, nr, nc - 1)) markValid(nr, nc - 1); if (nc + 1 < state.size && !isWallBetween(nr, nc, nr, nc + 1)) markValid(nr, nc + 1);
                            } else {
                                if (nr - 1 >= 0 && !isWallBetween(nr, nc, nr - 1, nc)) markValid(nr - 1, nc); if (nr + 1 < state.size && !isWallBetween(nr, nc, nr + 1, nc)) markValid(nr + 1, nc);
                            }
                        }
                    } else { markValid(nr, nc); }
                }
            });
        }

        function markValid(r, c) { const cell = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`); if (cell) cell.classList.add('valid-move'); }
        function isWallBetween(r1, c1, r2, c2) {
            if (r1 === r2) { const minC = Math.min(c1, c2); if (state.wallsV[r1] && state.wallsV[r1][minC]) return true; if (r1 > 0 && state.wallsV[r1 - 1] && state.wallsV[r1 - 1][minC]) return true; } 
            else if (c1 === c2) { const minR = Math.min(r1, r2); if (state.wallsH[minR] && state.wallsH[minR][c1]) return true; if (c1 > 0 && state.wallsH[minR] && state.wallsH[minR][c1 - 1]) return true; }
            return false;
        }

        function toggleWallMode(mode) { if (state.mode === 'online' && state.currentTurn !== state.myPlayerId) return; state.wallMode = state.wallMode === mode ? null : mode; document.getElementById('btn-wall-h').classList.toggle('active', state.wallMode === 'wall-h'); document.getElementById('btn-wall-v').classList.toggle('active', state.wallMode === 'wall-v'); updateView(); }
        function getRealWallCoords(type, r, c) { let realR = r, realC = c; const maxIdx = state.size - 2; if (type === 'h') { if (c > maxIdx || (c === maxIdx && state.wallsH[r][c]) || (c < maxIdx && state.wallsH[r][c+1])) realC = c - 1; } else { if (r > maxIdx || (r === maxIdx && state.wallsV[r][c]) || (r < maxIdx && state.wallsV[r+1] && state.wallsV[r+1][c])) realR = r - 1; } return { r: realR, c: realC }; }

        function hoverWall(type, r, c, isEnter) {
            if (state.mode === 'online' && state.currentTurn !== state.myPlayerId) return; if ((type === 'h' && state.wallMode !== 'wall-h') || (type === 'v' && state.wallMode !== 'wall-v')) return;
            const coords = getRealWallCoords(type, r, c); const hr = coords.r, hc = coords.c; if (hc < 0 || hr < 0 || hc >= state.size - 1 || hr >= state.size - 1) return;
            if (type === 'h' && (state.wallsH[hr][hc] || (hc > 0 && state.wallsH[hr][hc-1]) || (hc < state.size - 2 && state.wallsH[hr][hc+1]) || state.wallsV[hr][hc])) return;
            if (type === 'v' && (state.wallsV[hr][hc] || (hr > 0 && state.wallsV[hr-1][hc]) || (hr < state.size - 2 && state.wallsV[hr+1][hc]) || state.wallsH[hr][hc])) return;
            const sel = type === 'h' ? '.wall-space-h' : '.wall-space-v';
            const w1 = document.querySelector(`${sel}[data-r="${hr}"][data-c="${hc}"]`); const w2 = document.querySelector(`${sel}[data-r="${type==='h' ? hr : hr+1}"][data-c="${type==='h' ? hc+1 : hc}"]`);
            const inter = document.getElementById(`x-${hr}-${hc}`); [w1, w2, inter].forEach(el => { if (el) el.classList.toggle('wall-hover', isEnter); });
        }
                 function placeWall(type, r, c) {
            if (state.mode === 'online' && state.currentTurn !== state.myPlayerId) return; if ((type === 'h' && state.wallMode !== 'wall-h') || (type === 'v' && state.wallMode !== 'wall-v')) return;
            const coords = getRealWallCoords(type, r, c); const hr = coords.r, hc = coords.c; if (hc < 0 || hr < 0 || hc >= state.size - 1 || hr >= state.size - 1) return;
            const cur = state.currentTurn === 1 ? state.p1 : state.p2; if (cur.walls <= 0) return;
            if (type === 'h' && (state.wallsH[hr][hc] || (hc > 0 && state.wallsH[hr][hc-1]) || (hc < state.size - 2 && state.wallsH[hr][hc+1]) || state.wallsV[hr][hc])) return;
            if (type === 'v' && (state.wallsV[hr][hc] || (hr > 0 && state.wallsV[hr-1][hc]) || (hr < state.size - 2 && state.wallsV[hr+1][hc]) || state.wallsH[hr][hc])) return;

            if (type === 'h') { state.wallsH[hr][hc] = 1; } else { state.wallsV[hr][hc] = 1; }
            if (!hasPath(state.p1.r, state.p1.c, 0) || !hasPath(state.p2.r, state.p2.c, state.size - 1)) {
                if (type === 'h') { state.wallsH[hr][hc] = 0; } else { state.wallsV[hr][hc] = 0; }
                alert("Нельзя полностью перекрывать проход к финишу!"); return;
            }
            renderNetworkWall(type, hr, hc, state.currentTurn);
            
            if (state.mode === 'online' && channel) {
                channel.send({ type: 'broadcast', event: 'game_action', payload: { type: 'WALL', wallType: type, r: hr, c: hc } });
            }
            cur.walls--; toggleWallMode(state.wallMode); checkWinOrSwitch();
        }

        function renderNetworkWall(type, r, c, turn) {
            const cls = turn === 1 ? 'wall-p1' : 'wall-p2'; const sel = type === 'h' ? '.wall-space-h' : '.wall-space-v';
            const w1 = document.querySelector(`${sel}[data-r="${r}"][data-c="${c}"]`); const w2 = document.querySelector(`${sel}[data-r="${type==='h' ? r : r+1}"][data-c="${type==='h' ? c+1 : c}"]`);
            const inter = document.getElementById(`x-${r}-${c}`); [w1, w2, inter].forEach(el => { if (el) { el.classList.add('wall-active', cls); el.classList.remove('wall-hover'); } });
        }

        function hasPath(startR, startC, targetRow) {
            let visited = Array(state.size).fill().map(() => Array(state.size).fill(false)); let queue = [{r: startR, c: startC}]; visited[startR][startC] = true;
            while (queue.length > 0) {
                let curr = queue.shift(); if (curr.r === targetRow) return true; const dirs = [{dr: -1, dc: 0}, {dr: 1, dc: 0}, {dr: 0, dc: -1}, {dr: 0, dc: 1}];
                for (let d of dirs) {
                    let nr = curr.r + d.dr, nc = curr.c + d.dc;
                    if (nr >= 0 && nr < state.size && nc >= 0 && nc < state.size) {
                        if (!visited[nr][nc] && !isWallBetween(curr.r, curr.c, nr, nc)) { visited[nr][nc] = true; queue.push({r: nr, c: nc}); }
                    }
                }
            }
            return false;
        }

        function handleCellClick(r, c) {
            if (state.mode === 'online' && state.currentTurn !== state.myPlayerId) return; if (state.wallMode) return;
            const cell = document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`); if (!cell || !cell.classList.contains('valid-move')) return;
            const cur = state.currentTurn === 1 ? state.p1 : state.p2; cur.r = r; cur.c = c; cur.moves++;
            
            if (state.mode === 'online' && channel) {
                channel.send({ type: 'broadcast', event: 'game_action', payload: { type: 'MOVE', r: r, c: c } });
            }
            checkWinOrSwitch();
        }

        function checkWinOrSwitch() {
            if (state.p1.r === 0) { finishGame(1); return; } if (state.p2.r === state.size - 1) { finishGame(2); return; }
            state.currentTurn = state.currentTurn === 1 ? 2 : 1; updateView();
        }

        function startTimer() { totalGameTime = 0; clearInterval(matchTimer); matchTimer = setInterval(() => { totalGameTime++; }, 1000); }

        function finishGame(winner) {
            clearInterval(matchTimer); if (state.mode === 'online' && channel) channel.unsubscribe();
            document.getElementById('md-winner').innerText = winner === 1 ? 'Победил Синий 🎉' : 'Победил Красный 🏆'; document.getElementById('md-winner').style.color = winner === 1 ? '#3498db' : '#e74c3c';
            document.getElementById('st-m1').innerText = state.p1.moves; document.getElementById('st-m2').innerText = state.p2.moves;
            document.getElementById('st-w1').innerText = state.maxWalls - state.p1.walls; document.getElementById('st-w2').innerText = state.maxWalls - state.p2.walls;
            document.getElementById('st-total-time').innerText = totalGameTime + 'с'; document.getElementById('result-modal').style.display = 'flex';
        }
        function switchScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    </script>
</body>
</html>
